[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envello"
version = "0.1.1"
description = "Official Python SDK for the Envello transactional email API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Envello" }]
keywords = ["envello", "email", "transactional-email", "api", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.10", "mypy>=1.0"]

[project.urls]
Homepage = "https://envello.dev"
Repository = "https://github.com/Bergblumestudio/envello-python"

[tool.hatch.build.targets.wheel]
packages = ["src/envello"]

[tool.hatch.build.targets.sdist]
include = ["src/envello", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
